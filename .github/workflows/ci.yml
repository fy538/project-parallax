name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily health check (UTC); Linux + optional heavy macOS jobs below
    - cron: "0 12 * * *"

jobs:
  # Primary CI runs on Linux (faster + cheaper). Validates JSON, lint,
  # typecheck, full Python + Vitest test suites — the things that need to
  # pass on every commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-templates/package-lock.json

      - name: Install Python deps
        # `pip install -e '.[dev]'` reads pyproject.toml and pulls in pytest,
        # pytest-cov, ruff, jsonschema, requests. The bare `pip install` line
        # we had before was missing ruff entirely — `scripts/lint.sh` then
        # silently skipped the ruff check (its `if ruff --version` guard
        # protects fresh clones), so a new BLE001 / unused-import could land
        # on main without anyone noticing. Audit P0 fix May 18, 2026.
        run: pip install -e '.[dev]'

      - name: Install Node deps
        run: cd remotion-templates && npm ci

      - name: Validate JSON data
        run: python3 tools/validate_data.py

      - name: Run convention lint
        run: ./scripts/lint.sh

      - name: Run all tests
        run: ./scripts/test.sh

  # Smoke-test the macOS render path. The user develops on macOS and renders
  # locally there; without this job, the macOS-specific browser-detection
  # code in render-episode.mjs (Playwright cache at ~/Library/Caches/...,
  # Google Chrome for Testing fallback) is never exercised in CI. Doesn't
  # run renders — just typecheck + tests so any macOS-specific tooling
  # breakage surfaces here, not when Tiger first re-renders an episode.
  macos-smoke:
    # On schedule, macos-real-data already exercises Chromium; skip duplicate macOS runner.
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-templates/package-lock.json

      - name: Install Python deps
        # macos-smoke runs Vitest + tsc but invokes Python only via
        # tools/lint/polish_lint.py from scripts/check-episode.sh-style
        # paths; the lighter dep set (no ruff/cov) is fine here. Keep
        # parallel to the linux test job's deps to avoid drift —
        # pyproject.toml is the single source of truth.
        run: pip install -e '.'

      - name: Install Node deps
        run: cd remotion-templates && npm ci

      - name: TypeScript strict check
        run: ./scripts/typecheck.sh

      - name: Vitest unit tests (Remotion-side, no browser needed)
        run: cd remotion-templates && npm run test:unit

      - name: Install Playwright Chromium for visual regression
        run: cd remotion-templates && npx playwright install chromium

      - name: Vitest template smoke (templates.test.ts)
        # Renders sampled frames via Remotion + Chromium; not the episode-JSON
        # real-data suite. ImageComposite may skip without sample assets.
        run: cd remotion-templates && npm run test:visual

  # Episode-JSON PNG baselines: heavy (~10+ min). Skipped on pull_request.
  # Runs on push to main, nightly schedule, and workflow_dispatch.
  macos-real-data:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    concurrency:
      group: macos-real-data-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-templates/package-lock.json

      - name: Install Node deps
        run: cd remotion-templates && npm ci

      - name: Install Playwright Chromium for real-data renders
        run: cd remotion-templates && npx playwright install chromium

      - name: Vitest real-data PNG regression (*-real-data.test.ts)
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: cd remotion-templates && npm run test:real-data
