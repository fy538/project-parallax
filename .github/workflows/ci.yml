name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-templates/package-lock.json

      - name: Install Python deps
        run: pip install pytest jsonschema

      - name: Install Node deps
        run: cd remotion-templates && npm ci

      - name: Validate JSON data
        run: python3 tools/validate_data.py

      - name: Run all tests
        run: ./scripts/test.sh
