name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Primary CI runs on Linux (faster + cheaper). Validates JSON, lint,
  # typecheck, full Python + Vitest test suites — the things that need to
  # pass on every commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-templates/package-lock.json

      - name: Install Python deps
        run: pip install pytest pytest-cov jsonschema

      - name: Install Node deps
        run: cd remotion-templates && npm ci

      - name: Validate JSON data
        run: python3 tools/validate_data.py

      - name: Run convention lint
        run: ./scripts/lint.sh

      - name: Run all tests
        run: ./scripts/test.sh

  # Smoke-test the macOS render path. The user develops on macOS and renders
  # locally there; without this job, the macOS-specific browser-detection
  # code in render-episode.mjs (Playwright cache at ~/Library/Caches/...,
  # Google Chrome for Testing fallback) is never exercised in CI. Doesn't
  # run renders — just typecheck + tests so any macOS-specific tooling
  # breakage surfaces here, not when Tiger first re-renders an episode.
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-templates/package-lock.json

      - name: Install Python deps
        run: pip install pytest jsonschema

      - name: Install Node deps
        run: cd remotion-templates && npm ci

      - name: TypeScript strict check
        run: ./scripts/typecheck.sh

      - name: Vitest unit tests (Remotion-side, no browser needed)
        run: cd remotion-templates && npm run test:unit

      - name: Install Playwright Chromium for visual regression
        run: cd remotion-templates && npx playwright install chromium

      - name: Vitest visual regression (env-aware skips)
        # Visual regression renders ~36 stills via Remotion + Chromium and
        # diffs against committed baselines. Map tests skip without
        # MAPBOX_ACCESS_TOKEN; ImageComposite skips without the sample
        # asset. Both gracefully report as "skipped" rather than failing.
        # Mapbox token is optional — set it as a repo secret to extend
        # coverage to map templates in CI.
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: cd remotion-templates && npm run test:visual
