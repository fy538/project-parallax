<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Design Playground v4</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pg-bg: #12100E;
  --pg-sidebar-bg: #0D0B09;
  --pg-text: #D9C9B0;
  --pg-text-muted: #8B7355;
  --pg-border: #2A2520;
  --pg-accent: #C4A747;
  --pg-surface: #1C1814;
  --pg-elevated: #2A2520;
  --pg-us: #4A7BA7;
  --pg-cn: #A64D46;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--pg-text); background: var(--pg-bg); display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sidebar { width: 280px; background: var(--pg-sidebar-bg); border-right: 1px solid var(--pg-border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--pg-border); }
.sidebar-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--pg-accent); letter-spacing: 3px; }
.sidebar-header .subtitle { font-size: 9px; color: var(--pg-text-muted); margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase; }

/* ── Navigation ── */
.nav { padding: 8px 0; border-bottom: 1px solid var(--pg-border); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; color: var(--pg-text-muted); font-size: 11px; letter-spacing: 0.5px; transition: all 0.15s; }
.nav-item:hover { color: var(--pg-text); background: rgba(196,167,71,0.04); }
.nav-item.active { color: var(--pg-accent); background: rgba(196,167,71,0.08); border-right: 2px solid var(--pg-accent); }
.nav-item .icon { font-size: 14px; width: 20px; text-align: center; }
.nav-item .count { margin-left: auto; font-size: 9px; background: var(--pg-elevated); padding: 2px 6px; border-radius: 8px; }

/* ── Sidebar Controls ── */
.sidebar-controls { flex: 1; overflow-y: auto; padding: 12px 16px; }
.control-section { margin-bottom: 16px; }
.control-section h3 { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 600; color: var(--pg-accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; }
.control-section h3::after { content: '\2212'; font-size: 12px; }
.control-section.collapsed h3::after { content: '+'; }
.control-section.collapsed .controls { display: none; }
.control { margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
.control label { font-size: 9px; color: var(--pg-text-muted); min-width: 70px; flex-shrink: 0; }
.control input[type="range"] { flex: 1; height: 3px; -webkit-appearance: none; background: var(--pg-border); border-radius: 2px; outline: none; }
.control input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--pg-accent); cursor: pointer; }
.control .value { font-size: 9px; color: var(--pg-text-muted); min-width: 28px; text-align: right; font-family: 'JetBrains Mono', monospace; }
.control select { background: #1C1814; color: var(--pg-text); border: 1px solid var(--pg-border); padding: 2px 4px; font-size: 9px; font-family: 'IBM Plex Mono', monospace; flex: 1; }

/* ── Mode Toggle ── */
.mode-toggle { display: flex; gap: 0; margin: 12px 16px; border: 1px solid var(--pg-border); border-radius: 4px; overflow: hidden; }
.mode-toggle button { flex: 1; padding: 5px 8px; background: transparent; color: var(--pg-text-muted); border: none; font-family: 'IBM Plex Mono', monospace; font-size: 9px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
.mode-toggle button.active { background: var(--pg-accent); color: #1C1814; }

/* ── Main Content ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 12px 24px; border-bottom: 1px solid var(--pg-border); display: flex; align-items: center; gap: 16px; background: var(--pg-sidebar-bg); }
.main-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--pg-text); letter-spacing: 1px; }
.main-header .desc { font-size: 10px; color: var(--pg-text-muted); }
.view-toggle { margin-left: auto; display: flex; gap: 0; border: 1px solid var(--pg-border); border-radius: 3px; overflow: hidden; }
.view-toggle button { padding: 4px 10px; background: transparent; color: var(--pg-text-muted); border: none; font-size: 9px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
.view-toggle button.active { background: var(--pg-elevated); color: var(--pg-text); }

.canvas { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Gallery Grid ── */
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 20px; }
.gallery-item { background: var(--pg-surface); border: 1px solid var(--pg-border); border-radius: 6px; overflow: hidden; transition: border-color 0.2s; }
.gallery-item:hover { border-color: var(--pg-accent); }
.gallery-item .frame { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; }
.gallery-item .frame-inner { width: 1920px; height: 1080px; position: absolute; top: 0; left: 0; transform-origin: top left; }
.gallery-item .meta { padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--pg-border); }
.gallery-item .meta .name { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; color: var(--pg-text); }
.gallery-item .meta .tag { font-size: 9px; padding: 2px 6px; border-radius: 3px; background: var(--pg-elevated); color: var(--pg-text-muted); }
.gallery-item .meta .tag.hero { background: rgba(196,167,71,0.15); color: var(--pg-accent); }

/* ── Full Width View ── */
.full-view .gallery-grid { grid-template-columns: 1fr; max-width: 1100px; margin: 0 auto; }

/* ── Component Specimens ── */
.specimen-section { margin-bottom: 40px; }
.specimen-section h3 { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; color: var(--pg-accent); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--pg-border); }
.specimen-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.specimen-box { background: var(--pg-surface); border: 1px solid var(--pg-border); border-radius: 4px; padding: 16px; min-width: 200px; flex: 1; }
.specimen-label { font-size: 9px; color: var(--pg-text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

/* ── Quality Audit ── */
.audit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.audit-card { background: var(--pg-surface); border: 1px solid var(--pg-border); border-radius: 6px; padding: 16px; }
.audit-card h4 { font-family: 'Space Grotesk', sans-serif; font-size: 11px; color: var(--pg-text); margin-bottom: 8px; }
.audit-card .metric { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(42,37,32,0.5); }
.audit-card .metric:last-child { border: none; }
.audit-card .metric label { font-size: 9px; color: var(--pg-text-muted); }
.audit-card .metric .score { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
.score-good { color: #5DAA68; }
.score-warn { color: var(--pg-accent); }
.score-bad { color: var(--pg-cn); }

/* ── Palette Page ── */
.palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
.palette-chip { border-radius: 6px; overflow: hidden; border: 1px solid var(--pg-border); }
.palette-chip .swatch { height: 60px; }
.palette-chip .info { padding: 8px; background: var(--pg-surface); }
.palette-chip .info .token { font-size: 9px; color: var(--pg-text); font-weight: 600; }
.palette-chip .info .hex { font-size: 9px; color: var(--pg-text-muted); font-family: 'JetBrains Mono', monospace; }

/* Hidden pages */
.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>&#8756; PARALLAX</h1>
    <div class="subtitle">Design System v4</div>
  </div>

  <div class="nav" id="nav">
    <div class="nav-item active" data-page="gallery"><span class="icon">&#9638;</span>Template Gallery<span class="count">21</span></div>
    <div class="nav-item" data-page="components"><span class="icon">&#9649;</span>Components</div>
    <div class="nav-item" data-page="backgrounds"><span class="icon">&#9681;</span>Backgrounds</div>
    <div class="nav-item" data-page="palette"><span class="icon">&#9672;</span>Palette &amp; Ramps</div>
    <div class="nav-item" data-page="typography"><span class="icon">A</span>Typography</div>
    <div class="nav-item" data-page="audit"><span class="icon">&#10003;</span>Quality Audit</div>
    <div class="nav-item" data-page="tuner"><span class="icon">&#9881;</span>Token Tuner</div>
  </div>

  <div class="mode-toggle">
    <button class="active" onclick="setMode('light')" id="btn-light">Light</button>
    <button onclick="setMode('dark')" id="btn-dark">Dark</button>
  </div>

  <div class="sidebar-controls" id="sidebar-controls"></div>
</div>

<div class="main">
  <div class="main-header" id="main-header">
    <h2 id="page-title">Template Gallery</h2>
    <span class="desc" id="page-desc">All 21 Remotion templates — keyframe at peak visual density</span>
    <div class="view-toggle">
      <button class="active" onclick="setView('grid')" id="vbtn-grid">Grid</button>
      <button onclick="setView('full')" id="vbtn-full">Full</button>
    </div>
  </div>
  <div class="canvas" id="canvas"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
// PARALLAX DESIGN PLAYGROUND v4 — Expanded Asset Catalog
// ══════════════════════════════════════════════════════════════════════

let currentMode = 'light';
let currentPage = 'gallery';
let currentView = 'grid';

// ── Palette (from palette.json) ─────────────────────────────────────
const PAL = {
  ink:'#1C1814', midnight:'#2A2520', walnut:'#5C4A3D', umber:'#8B7355',
  taupe:'#B8A189', sand:'#D9C9B0', bone:'#F0E6D0', paper:'#F5F0E8', gold:'#C4A747',
  us:'#4A7BA7', cn:'#A64D46', neutral:'#888780'
};
const RAMPS = {
  warm:['#F5F0E8','#D9C9B0','#B8A189','#8B7355','#5C4A3D','#1C1814'],
  blue:['#E8F0F6','#9DBDD6','#4A7BA7','#2E5C82','#163048'],
  red:['#F5E8E7','#CFA09C','#A64D46','#7A3530','#3D1A18'],
  gold:['#FFF6E0','#E8D49A','#C4A747','#967E30','#5C4D1A'],
  gray:['#F1EFE8','#B4B2A9','#888780','#5F5E5A','#2C2C2A']
};

const DARK = { bg:'#12100E', surface:PAL.ink, elevated:PAL.midnight, textPrimary:PAL.sand, textSecondary:PAL.taupe, textMuted:PAL.umber, accent:PAL.gold, shadow:'0 2px 12px rgba(0,0,0,0.25)' };
const LIGHT = { bg:PAL.paper, surface:'#EDE7DB', elevated:'#FFFFFF', textPrimary:PAL.ink, textSecondary:PAL.walnut, textMuted:PAL.umber, accent:PAL.walnut, shadow:'0 1px 8px rgba(0,0,0,0.08)' };

function M() { return currentMode === 'dark' ? DARK : LIGHT; }
function isDark() { return currentMode === 'dark'; }

// ── Helpers ─────────────────────────────────────────────────────────
function hexA(hex, alpha) { return hex + Math.round(alpha*255).toString(16).padStart(2,'0'); }
function darken(hex, pct) { const [r,g,b]=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)); const f=1-pct/100; return '#'+[r,g,b].map(c=>Math.round(c*f).toString(16).padStart(2,'0')).join(''); }

// ── Background renderer (matches Remotion Background.tsx) ───────────
function renderBg(tint, atmosphere='normal') {
  const m = M();
  const base = isDark()
    ? `background: radial-gradient(ellipse at 60% 40%, ${m.surface} 0%, ${m.bg} 100%);`
    : `background: ${m.bg};`;

  // Film grain layer
  const grain = `<div style="position:absolute;inset:0;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%224%22 height=%224%22><rect width=%224%22 height=%224%22 fill=%22%23808080%22 opacity=%220.03%22/></svg>');mix-blend-mode:${isDark()?'overlay':'multiply'};opacity:${isDark()?0.12:0.04};"></div>`;

  // Vignette
  const vignette = isDark()
    ? `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.35) 100%);"></div>`
    : `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.04) 100%);"></div>`;

  // Light ray (the "cinematic" differentiator)
  const tintColor = tint || PAL.gold;
  const lightRay = atmosphere !== 'none'
    ? `<div style="position:absolute;top:-200px;right:-100px;width:800px;height:1400px;background:linear-gradient(135deg,transparent 0%,${hexA(tintColor,0.025)} 30%,${hexA(tintColor,0.04)} 50%,${hexA(tintColor,0.025)} 70%,transparent 100%);transform:rotate(-15deg);mix-blend-mode:${isDark()?'screen':'multiply'};opacity:0.8;"></div>`
    : '';

  // Bokeh orbs
  const bokeh = atmosphere !== 'none' ? [0,1,2,3,4].map(i => {
    const x = 200 + i * 380 + (i%2)*100;
    const y = 150 + (i%3)*300;
    const size = 40 + i*20;
    return `<div style="position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:50%;background:radial-gradient(circle,${hexA(tintColor,0.04)} 0%,transparent 70%);filter:blur(${size*0.3}px);mix-blend-mode:${isDark()?'screen':'multiply'};"></div>`;
  }).join('') : '';

  // Ruled border (light mode)
  const ruled = !isDark()
    ? `<div style="position:absolute;top:40px;left:40px;right:40px;bottom:40px;border:0.5px solid ${hexA(PAL.sand,0.5)};pointer-events:none;"></div>`
    : '';

  return `<div style="position:absolute;inset:0;${base}">${grain}${vignette}${lightRay}${bokeh}${ruled}</div>`;
}

// ── Metadata Strip ──────────────────────────────────────────────────
function metaStrip(episode='THE SILICON TRAP') {
  const m = M();
  const style = `font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:${m.textMuted};`;
  return `
    <div style="position:absolute;top:40px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="${style}color:${isDark()?PAL.gold:PAL.umber};font-size:14px;font-weight:700;">&#8756;</span>
        <span style="${style}">PARALLAX</span>
      </div>
      <span style="${style}">EP.01 &#8212; ${episode}</span>
    </div>
    <div style="position:absolute;bottom:40px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;">
      <span style="${style}">FILED 2026-04-25</span>
      <span style="${style}">1:150,000</span>
    </div>`;
}

// ── Crosshair Reticle ───────────────────────────────────────────────
function crosshair(x, y, size=120) {
  const color = isDark() ? PAL.gold : PAL.walnut;
  const op = isDark() ? 0.5 : 0.35;
  return `<svg style="position:absolute;left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;opacity:${op};" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="45" fill="none" stroke="${color}" stroke-width="0.75" opacity="0.6"/>
    <circle cx="60" cy="60" r="3" fill="${color}" opacity="0.8"/>
    <line x1="0" y1="60" x2="35" y2="60" stroke="${color}" stroke-width="0.5" opacity="0.4"/>
    <line x1="85" y1="60" x2="120" y2="60" stroke="${color}" stroke-width="0.5" opacity="0.4"/>
    <line x1="60" y1="0" x2="60" y2="35" stroke="${color}" stroke-width="0.5" opacity="0.4"/>
    <line x1="60" y1="85" x2="60" y2="120" stroke="${color}" stroke-width="0.5" opacity="0.4"/>
  </svg>`;
}

// ══════════════════════════════════════════════════════════════════════
// TEMPLATE RENDERERS — Static keyframes at peak visual density
// ══════════════════════════════════════════════════════════════════════

const TEMPLATES = [
  { id:'stat-reveal', name:'StatReveal', tag:'hero', desc:'Dramatic single-stat with comparison bars', render: renderStatReveal },
  { id:'data-chart', name:'DataChart', tag:'core', desc:'Bar/line charts with gradient fills', render: renderDataChart },
  { id:'framework-diagram', name:'FrameworkDiagram', tag:'core', desc:'Structured concept layouts', render: renderFrameworkDiagram },
  { id:'dueling-frameworks', name:'DuelingFrameworks', tag:'core', desc:'A vs B comparison columns', render: renderDuelingFrameworks },
  { id:'timeline-morph', name:'TimelineMorph', tag:'core', desc:'Horizontal event sequence', render: renderTimelineMorph },
  { id:'escalation-ladder', name:'EscalationLadder', tag:'core', desc:'Vertical severity ladder', render: renderEscalationLadder },
  { id:'network-diagram', name:'NetworkDiagram', tag:'core', desc:'Nodes and edges — actors/institutions', render: renderNetworkDiagram },
  { id:'bayesian-update', name:'BayesianUpdate', tag:'hero', desc:'Probability distribution shifts', render: renderBayesianUpdate },
  { id:'sankey-flow', name:'SankeyFlow', tag:'core', desc:'Value flow through stages', render: renderSankeyFlow },
  { id:'game-board', name:'GameBoard', tag:'hero', desc:'Chess/Go/Payoff matrix metaphors', render: renderGameBoard },
  { id:'choropleth-map', name:'ChoroplethMap', tag:'core', desc:'Country fills + alliances', render: renderChoroplethMap },
  { id:'route-animation', name:'RouteAnimation', tag:'core', desc:'Supply chains, trade routes', render: renderRouteAnimation },
  { id:'radar-chart', name:'RadarChart', tag:'core', desc:'Multi-axis comparison', render: renderRadarChart },
  { id:'time-series', name:'TimeSeriesChart', tag:'core', desc:'Temporal trend lines', render: renderTimeSeriesChart },
  { id:'dual-timeline', name:'DualTimeline', tag:'core', desc:'Parallel event streams', render: renderDualTimeline },
  { id:'decision-tree', name:'DecisionTree', tag:'core', desc:'Branching scenario paths', render: renderDecisionTree },
  { id:'kinetic-typo', name:'KineticTypography', tag:'core', desc:'Animated text reveals', render: renderKineticTypo },
  { id:'title-transition', name:'TitleTransition', tag:'core', desc:'Section title cards', render: renderTitleTransition },
  { id:'photo-montage', name:'PhotoMontage', tag:'core', desc:'Multi-image layouts with treatment', render: renderPhotoMontage },
  { id:'split-composition', name:'SplitComposition', tag:'core', desc:'Split-screen image + text', render: renderSplitComposition },
  { id:'probability-gauge', name:'ProbabilityGauge', tag:'core', desc:'Circular probability indicator', render: renderProbabilityGauge },
];

function frame(content, tint, atmo) {
  return `<div style="width:1920px;height:1080px;position:relative;overflow:hidden;font-family:'Space Grotesk',sans-serif;">
    ${renderBg(tint, atmo)}
    <div style="position:relative;z-index:1;width:100%;height:100%;">${metaStrip()}${content}</div>
  </div>`;
}

function renderStatReveal() {
  const m = M();
  return frame(`
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:${m.textMuted};text-transform:uppercase;letter-spacing:3px;margin-bottom:20px;">Global chip shortage peak</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:128px;font-weight:700;color:${m.textPrimary};letter-spacing:3px;line-height:1;">$<span style="color:${PAL.gold};">574</span>B</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;color:${m.textSecondary};margin-top:16px;">Total semiconductor revenue, 2022</div>
      <div style="width:400px;height:1px;margin:36px auto;background:linear-gradient(90deg,transparent,${hexA(PAL.gold,0.4)},transparent);"></div>
      <div style="display:flex;gap:32px;justify-content:center;margin-top:32px;">
        ${['92%|TSMC Share','34|Litho Passes','$52B|CHIPS Act'].map((d,i) => {
          const [val,lbl] = d.split('|');
          return `<div style="background:${m.elevated};border-radius:8px;padding:20px 28px;box-shadow:${m.shadow};border:${isDark()?'0.5px solid rgba(255,255,255,0.06)':'0.5px solid rgba(0,0,0,0.06)'};">
            <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:${i===0?PAL.gold:m.textPrimary};">${val}</div>
            <div style="font-size:11px;color:${m.textMuted};margin-top:4px;">${lbl}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `, PAL.gold);
}

function renderDataChart() {
  const m = M();
  const bars = [{l:'TSMC',v:92,c:PAL.gold},{l:'Samsung',v:68,c:PAL.umber},{l:'Intel',v:45,c:PAL.taupe},{l:'SMIC',v:34,c:PAL.cn},{l:'GF',v:28,c:PAL.taupe}];
  const maxH = 520;
  const bw = 140, gap = 24, startX = 240;
  return frame(`
    <div style="position:absolute;top:80px;left:80px;">
      <div style="font-size:42px;font-weight:600;color:${m.textPrimary};letter-spacing:2px;">Global Semiconductor Market Share</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:18px;color:${m.textMuted};margin-top:8px;">Advanced node capacity by foundry, Q4 2025</div>
    </div>
    ${bars.map((b,i) => {
      const h = (b.v/92)*maxH;
      const x = startX + i*(bw+gap);
      return `
        <div style="position:absolute;bottom:120px;left:${x}px;width:${bw}px;height:${h}px;background:linear-gradient(180deg,${b.c} 0%,${darken(b.c,20)} 100%);border-radius:6px 6px 0 0;"></div>

function renderBayesianUpdate() {
  const m = M();
  // Draw a bell curve via SVG
  const w = 1400, h = 400, cx = 260, cy = 300;
  let pathPrior = '', pathPost = '';
  for (let i = 0; i <= 100; i++) {
    const x = (i/100)*w;
    const yP = h - h*0.8*Math.exp(-0.5*((i-40)/12)**2);
    const yA = h - h*0.95*Math.exp(-0.5*((i-65)/8)**2);
    pathPrior += (i===0?'M':'L')+`${x},${yP}`;
    pathPost += (i===0?'M':'L')+`${x},${yA}`;
  }
  return frame(`
    <div style="position:absolute;top:80px;left:80px;">
      <div style="font-size:42px;font-weight:600;color:${m.textPrimary};letter-spacing:2px;">Bayesian Update</div>

      <path d="${pathPrior}L${w},${h}L0,${h}Z" fill="${hexA(PAL.us,0.15)}" stroke="${PAL.us}" stroke-width="2"/>
      <path d="${pathPost}L${w},${h}L0,${h}Z" fill="${hexA(PAL.cn,0.15)}" stroke="${PAL.cn}" stroke-width="2"/>

function renderBackgroundsPage() {
  const canvas = document.getElementById('canvas');
  const configs = [
    {label:'Standard (gold tint, normal atmosphere)', tint:PAL.gold, atmo:'normal'},
    {label:'Conflict (red tint, dense atmosphere)', tint:PAL.cn, atmo:'dense'},
    {label:'Analytical (blue tint, subtle atmosphere)', tint:PAL.us, atmo:'subtle'},
    {label:'Minimal (no atmosphere)', tint:null, atmo:'none'},
  ];
  let html = '<div class="gallery-grid">';
  configs.forEach(cfg => {
    const scaleNum = 480/1920;
    const content = `<div style="width:1920px;height:1080px;position:relative;overflow:hidden;">
      ${renderBg(cfg.tint, cfg.atmo)}
      <div style="position:relative;z-index:1;width:100%;height:100%;">${metaStrip()}
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">

        </div>
        ${crosshair(960, 540)}
      </div>
    </div>`;
    html += `<div class="gallery-item">
      <div class="frame" style="height:${1080*scaleNum}px;">
        <div class="frame-inner" style="transform:scale(${scaleNum});">${content}</div>
      </div>
      <div class="meta"><span class="name">${cfg.label}</span></div>
    </div>`;
  });
  html += '</div>';
  canvas.innerHTML = html;
}

// NAVIGATION + STATE
// ═════════���════════════════════════════════════════════════════════════

const PAGE_META = {
  gallery: { title:'Template Gallery', desc:'All 21 Remotion templates — keyframe at peak visual density' },
  components: { title:'Component Specimens', desc:'Shared UI elements isolated for polish assessment' },
  backgrounds: { title:'Background Variants', desc:'5-layer cinematic backgrounds with atmosphere configs' },
  palette: { title:'Palette & Ramps', desc:'Full color system — tokens, semantics, ramps, duotones' },
  typography: { title:'Typography', desc:'Type scale, font pairing, color hierarchy' },
  audit: { title:'Quality Audit', desc:'Cinematic polish checklist — what separates us from PowerPoint' },
  tuner: { title:'Token Tuner', desc:'Live design token adjustment' },
};

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  document.getElementById('page-title').textContent = PAGE_META[page].title;
  document.getElementById('page-desc').textContent = PAGE_META[page].desc;
  renderCurrentPage();
}

function renderCurrentPage() {
  const renderers = { gallery:renderGalleryPage, components:renderComponentsPage, backgrounds:renderBackgroundsPage, palette:renderPalettePage, typography:renderTypographyPage, audit:renderAuditPage, tuner:renderTunerPage };
  (renderers[currentPage] || renderGalleryPage)();
}

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+m).classList.add('active');
  renderCurrentPage();
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('vbtn-'+v).classList.add('active');
  if (currentPage === 'gallery') renderGalleryPage();
}

// Wire up navigation
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => navigateTo(item.dataset.page));
});

// Initial render
renderCurrentPage();
</script>
