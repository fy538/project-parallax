<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Same transaction, two accounts</title><style>
*{box-sizing:border-box}body{margin:0;background:#F5F0E8;color:#1C1814;font-family:"IBM Plex Sans",Arial,sans-serif}
#two-accounts{width:1600px;height:900px;position:relative;overflow:hidden;background:#F5F0E8}
h1{font-size:48px;text-align:center;font-weight:600;margin:70px 0 47px}
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin:0 64px}
.account{margin:0}.account h2{font-size:32px;letter-spacing:5px;font-weight:600;margin:0 0 24px;color:#5C4A3D}
.account img{width:100%;aspect-ratio:1672/941;display:block}
.account figcaption{font-size:36px;line-height:1.3;margin-top:23px}
.refrain{position:absolute;bottom:44px;left:0;right:0;text-align:center;margin:0;font-size:32px;color:#5C4A3D}
</style><section id="two-accounts" aria-label="Two interpretations of the exact same transaction"><h1>Same action. Two accounts.</h1><div class="accounts">
<figure class="account"><h2>DUTY</h2><img src="03-shop-transaction.png" alt="Shopkeeper offers correct change to a child"><figcaption>Cheating a child is wrong.</figcaption></figure>
<figure class="account"><h2>PRUDENCE</h2><img src="03-shop-transaction.png" alt="The identical shopkeeper and child transaction"><figcaption>Parents talk.</figcaption></figure>
</div><p class="refrain">Same bread. Same price. Same change.</p></section></html>
